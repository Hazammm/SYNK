[project]
name = "synk-agent"
version = "0.1.0"
description = "LangGraph tool-calling agent for Synk"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain>=0.3",
    "langchain-google-genai>=2.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The image's app directory is read-only for the service user.
addopts = "-p no:cacheprovider"
pythonpath = ["."]
