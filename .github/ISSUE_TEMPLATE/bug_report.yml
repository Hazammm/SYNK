name: Bug report
description: Something in Synk is broken or does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For a security problem, do **not** use this form; follow [SECURITY.md](https://github.com/Hazammm/SYNK/blob/main/SECURITY.md) instead.
        For an accessibility barrier, start the title with `[a11y]`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Chat in a workspace
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat
        - Board, tickets or sprints
        - Docs
        - Time tracking
        - People or profiles
        - Alerts and notifications
        - Synk AI assistant
        - Sign-in, invitations or settings
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome 131 on Windows 11, Safari on iPhone 15
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, console errors or logs
      description: Remove any passwords, tokens or personal data before pasting.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues, and this has not been reported.
          required: true
