name: Chat foundation
on:
  pull_request:
  push:
    branches: [main, 'feat/secure-realtime-chat']
permissions:
  contents: read
jobs:
  # The agent's tests use a scripted model, so they need no API key or network.
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t synk-agent ./agent
      - run: docker run --rm synk-agent pytest -q
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synk
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: synk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U synk -d synk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://synk:test_only@localhost:5432/synk_test
      TEST_DATABASE_URL: postgresql://synk:test_only@localhost:5432/synk_test
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-not-a-production-secret-123456789
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_SERVER_COMMAND: npm start
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      # The runner image already has Chromium's system libraries; --with-deps only adds extra fonts through apt.
      # If the Ubuntu mirrors are unreachable, give up after four minutes and install just the browser.
      - run: timeout 240 npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run test:e2e
        env:
          # Required by npm start; the browser tests never request a reset email.
          RESEND_API_KEY: ci-only-not-a-real-key
          EMAIL_FROM: Synk CI <ci@example.test>
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
