name: Chat foundation
on:
  pull_request:
  push:
    branches: [main, 'feat/secure-realtime-chat']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synk
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: synk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U synk -d synk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://synk:test_only@localhost:5432/synk_test
      TEST_DATABASE_URL: postgresql://synk:test_only@localhost:5432/synk_test
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-not-a-production-secret-123456789
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_SERVER_COMMAND: npm start
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
