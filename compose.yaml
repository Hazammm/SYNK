services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synk
      POSTGRES_PASSWORD: synk_local_only
      POSTGRES_DB: synk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - synk_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synk -d synk"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  synk_postgres:
